name: map-render-wasm

on:
  pull_request:
  push:
    branches: [main]

jobs:
  wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm install

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build wasm backend
        run: npm run -s rs:cpp-map-render-wasm

      - name: Run wasm parity
        run: npm run -s rs:map-render-wasm-parity -- --iterations 12

